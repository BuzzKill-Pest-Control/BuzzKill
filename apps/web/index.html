<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Title, description, robots, Open Graph / Twitter defaults, geo tags,
         and the site-wide JSON-LD entity graph are generated from
         src/seo/ (the route registry and company record) by the bk-shell-head
         plugin in vite.config.ts. Nothing page-specific belongs here: this
         file is served for every route, so a canonical or og:url in it would
         claim every page is the home page. -->
    <!--bk:head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Google tag (gtag.js) — property is env-driven so staging can report
         to a separate GA4 property. Vite replaces %VITE_GA_ID% at build time;
         the fallback keeps tracking alive if the var is unset at build. -->
    <script>
      window.GA_ID = '%VITE_GA_ID%';
      if (!window.GA_ID || window.GA_ID.indexOf('%') === 0) window.GA_ID = 'G-PEL59Y653T';
      var gaScript = document.createElement('script');
      gaScript.async = true;
      gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.GA_ID;
      document.head.appendChild(gaScript);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', window.GA_ID, { send_page_view: false });
      // Google Ads base tag — same gtag.js instance (do NOT add a second
      // gtag.js script). Conversion events fire from React success handlers.
      gtag('config', 'AW-18345277313');
    </script>

    <!-- Microsoft Clarity (session replay + heatmaps). Loaded here in the SPA
         shell so it covers every route/page automatically. Project wan5977c41. -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "wan5977c41");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

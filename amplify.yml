version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            - nvm install 22.23.3 && nvm use 22.23.3
            - npm install --global npm@11.11.0
            - npm ci --cache .npm --prefer-offline
            # Backend business rules (billing cadence, lead capture) are tested
            # before anything deploys — a broken money rule must fail the build,
            # not reach production and wait to be noticed.
            - env -u BUZZKILL_MIGRATION_PREVIEW npm test
            # Deploys the backend (auth, data, lead-intake function) and writes
            # amplify_outputs.json — including the lead-intake Function URL —
            # to the app root before the frontend phase runs.
            - |
              if [ "$BUZZKILL_MIGRATION_PREVIEW" = "true" ]; then
                test -n "$BUZZKILL_DESTINATION_ACCOUNT_ID" || { echo "Destination account ID is required"; exit 1; }
                test "$BUZZKILL_DESTINATION_ACCOUNT_ID" != "637423611040" || { echo "Source account is forbidden in preview"; exit 1; }
                test "$(aws sts get-caller-identity --query Account --output text)" = "$BUZZKILL_DESTINATION_ACCOUNT_ID" || { echo "Build account mismatch"; exit 1; }
              fi
              npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
    frontend:
      phases:
        build:
          commands:
            # Workaround for aws-amplify/amplify-backend#2190: Hosting env vars
            # aren't auto-injected into the Vite build. Anything set as a
            # Hosting env var with the VITE_ prefix is forwarded into a .env
            # file so import.meta.env can see it. Safe no-op when nothing is set.
            - env | grep -E '^VITE_' >> .env || true
            - npm run build
            # Staging must never compete with www.pestbuzzkill.com in search:
            # non-main branches get a hard noindex (robots.txt + meta).
            - |
              if [ "$AWS_BRANCH" != "main" ]; then
                printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
                find dist -name '*.html' -exec sed -i 's/<meta name="robots" content="[^"]*"/<meta name="robots" content="noindex, nofollow"/' {} +
                # The sitemap lists production URLs; a staging host must not
                # advertise them.
                rm -f dist/sitemap.xml
              fi
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
  - appRoot: apps/crm
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.23.3 && nvm use 22.23.3
            - npm install --global npm@11.11.0
            - npm ci --cache .npm --prefer-offline
            # The CRM imports the backend Schema *type* from apps/web, and
            # TypeScript resolves that file's imports through apps/web's own
            # node_modules — install them too (type-only, nothing from
            # apps/web ships in the CRM bundle).
            - cd ../web && npm ci --cache ../crm/.npm --prefer-offline && cd ../crm
        build:
          commands:
            # The CRM consumes the web app's Amplify backend (apps/web owns the
            # single backend) instead of deploying its own — no pipeline-deploy
            # here. Both apps build in parallel on push, so the web app's
            # backend deploy may still be running: retry until the outputs
            # match the newest schema — newest models/fields PRESENT and
            # removed fields GONE. A model.list() bakes the full field set from
            # this introspection, so stale outputs make new models undefined OR
            # keep querying a removed field (AppSync then rejects the query).
            - |
              if [ "$BUZZKILL_MIGRATION_PREVIEW" = "true" ]; then
                test -n "$BUZZKILL_DESTINATION_ACCOUNT_ID" || { echo "Destination account ID is required"; exit 1; }
                test "$BUZZKILL_DESTINATION_ACCOUNT_ID" != "637423611040" || { echo "Source account is forbidden in preview"; exit 1; }
                test "$(aws sts get-caller-identity --query Account --output text)" = "$BUZZKILL_DESTINATION_ACCOUNT_ID" || { echo "Build account mismatch"; exit 1; }
                test -n "$BUZZKILL_BACKEND_APP_ID" || { echo "Destination backend app ID is required"; exit 1; }
                test "$BUZZKILL_BACKEND_APP_ID" != "d26qpsjewk0bee" || { echo "Source backend is forbidden in preview"; exit 1; }
              fi
              BACKEND_APP_ID="${BUZZKILL_BACKEND_APP_ID:-d26qpsjewk0bee}"
              if [ "$BUZZKILL_MIGRATION_PREVIEW" = "true" ]; then
                BACKEND_ARN=$(aws amplify get-app --app-id "$BACKEND_APP_ID" --query app.appArn --output text) || exit 1
                case "$BACKEND_ARN" in
                  arn:aws:amplify:*:"$BUZZKILL_DESTINATION_ACCOUNT_ID":apps/"$BACKEND_APP_ID") ;;
                  *) echo "Backend app does not belong to the destination account"; exit 1 ;;
                esac
              fi
              for i in $(seq 1 60); do
                rm -f amplify_outputs.json
                npx ampx generate outputs --app-id "$BACKEND_APP_ID" --branch "$AWS_BRANCH" || true
                if node -e "const i=(require('./amplify_outputs.json').data||{}).model_introspection||{};const m=i.models||{};const p=(i.mutations||{}).prepareLeadQuote;process.exit(m.Product&&m.ServiceReport&&m.LeadPricingRun&&m.LeadPricingRun.fields.researchRateKey&&p&&p.arguments.customerId&&m.Job&&!m.Job.fields.timeWindow&&!m.Job.fields.capacityWindow?0:1)" 2>/dev/null; then
                  echo "backend outputs are current (attempt $i)"; break
                fi
                if [ "$i" = "60" ]; then echo "ERROR backend outputs still stale after 30 minutes" && exit 1; fi
                echo "outputs stale or missing (attempt $i) — backend deploy likely in flight, retrying in 30s"; sleep 30
              done
            - env | grep -E '^VITE_' >> .env || true
            # The office money screens compute revenue. Same rule as the backend:
            # a broken money rule fails the build rather than shipping.
            - env -u BUZZKILL_MIGRATION_PREVIEW npm test
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
          - ../web/node_modules/**/*
